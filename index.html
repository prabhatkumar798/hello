<style>

    box-sizing: border-box;
}

.poster {
    width: 100%;
    max-width: 1536px;
    margin: auto;
    aspect-ratio: 1536 / 1024;
    position: relative;
    overflow: hidden;
    background-image: url("backgroung.jpg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}

/* UPPER TWO PHOTOS */

.top-photo {
    position: absolute;
    top: 19%;
    width: 22%;
    height: 34%;
    border-radius: 50%;
    padding: 2px;
    border: 5px solid #e6a52c;
    background: #fff3d5;
    box-shadow: 0 0 0 3px #7a2500;
    overflow: hidden;
}

.top-left {
    left: 4%;
}

.top-right {
    right: 4.5%;
}

.top-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
}

/* TOP PHOTO NAMES */

.top-name {
    position: absolute;
    top: 50%;
    width: 19%;
    height: 5%;
    background: #fff0c4;
    border: 3px solid #d38a18;
    border-radius: 20px;
    text-align: center;
    color: #6b1600;
    font-weight: bold;
    font-size: clamp(9px, 1.2vw, 20px);
    padding: 5px;
    overflow: hidden;
}

.name-left {
    left: 6%;
}

.name-right {
    right: 6%;
}

/* BOTTOM 20 PHOTOS */

.members {
    position: absolute;
    left: 9%;
    top: 63%;
    width: 85%;
    height: 30%; 
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    column-gap: 10px;
    row-gap: 4%;
}

.member {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: linear-gradient(135deg, #310008, #800020, #1a0005);
}

#image_fix {
    background: linear-gradient(135deg, #310008, #800020, #1a0005);
    width: 95%;
    height: 345px;
    left: 30px;
    top: 470px;
    border-radius: 2%;
}

.member img {
    width: 100%;
    height: 78%;
    object-fit: cover;
    object-position: center top;
    border: 3px solid #d99524;
    border-radius: 13px;
    background: #eee;
    padding: 2px;
    display: block;
}

.member-name {
    width: 94%;
    height: 19%;
    margin-top: 2px;
    background: #fff0c8;
    border: 2px solid #d99524;
    border-radius: 8px;
    text-align: center;
    color: #651900;
    font-weight: bold;
    font-size: clamp(6px, 0.7vw, 12px);
    padding: 2px 1px;
    overflow: hidden;
}

/* RESPONSIVE */

@media (max-width: 600px) {
    body {
        padding: 3px;
    }

    .poster {
        width: 100%;
    }

    .top-photo {
        border-width: 2px;
        padding: 2px;
    }

    .member img {
        border-width: 1px;
        border-radius: 4px;
        padding: 0;
    }

    .member-name {
        border-width: 1px;
        border-radius: 3px;
        padding: 0;
    }

    .top-name {
        border-width: 1px;
        padding: 2px 0;
    }
}

/* PRINT SETTINGS (केवल पोस्टर प्रिंट करने के लिए) */

@media print {
     @page {
        margin: 0;
        size: landscape; /* पोस्टर लैंडस्केप अनुपात (1536/1024) में सही फिट बैठेगा */
    } 

    html{
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        width: 100% !important;
        height: 100% !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    /* बॉडी के बाकी सभी तत्वों को छुपाएं, सिर्फ पोस्टर दिखाएं */
    /* body * {
        visibility: hidden;
    } */

    .poster, .poster * {
        visibility: visible;
    }

    .poster {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw !important;
        max-width: none !important;
        height: 100vh !important;
        margin: 0 !important;
        box-shadow: none !important;
        page-break-after: avoid;
        page-break-inside: avoid;
    }
}
</style>
